# External skill manifest for SF Demo Scout (plugin edition).
# Maintainer-only metadata: consumed by scripts/vendor-skills.sh at
# vendoring time, NOT read at runtime. All 19 skills (3 demo-* + the
# 16 upstream skills below) ship vendored inside the plugin under
# ${CLAUDE_PLUGIN_ROOT}/skills/.
#
# To re-vendor (e.g. pull latest upstream): run
#   bash scripts/vendor-skills.sh
# from the plugin root, review the resulting git diff under skills/,
# and commit. Edit `branch:` below to pin to a specific upstream
# branch (or change `repo:` to repoint a source).

sources:
  jaganpro:
    repo: https://github.com/forcedotcom/sf-skills
    type: clone
    branch: Jaganpro/sf-skills
  afv:
    repo: https://github.com/forcedotcom/sf-skills
    type: clone
    branch: main

skills:
  # Jaganpro's sf-* skills — cloned from forcedotcom/sf-skills's
  # Jaganpro/sf-skills branch (canonical Salesforce skills repo,
  # renamed from forcedotcom/afv-library; both names served identical
  # content during the transition). The branch is still temporary —
  # these merge into sf-skills/main eventually. When that happens,
  # collapse this into the `afv` source.
  # Full directory clone picks up SKILL.md + assets/ + references/ + hooks/.
  - name: sf-flow
    source: jaganpro
    path: skills/sf-flow
  - name: sf-permissions
    source: jaganpro
    path: skills/sf-permissions
  - name: sf-deploy
    source: jaganpro
    path: skills/sf-deploy
  - name: sf-apex
    source: jaganpro
    path: skills/sf-apex
  - name: sf-soql
    source: jaganpro
    path: skills/sf-soql
  - name: sf-data
    source: jaganpro
    path: skills/sf-data
  - name: sf-debug
    source: jaganpro
    path: skills/sf-debug
  - name: sf-lwc
    source: jaganpro
    path: skills/sf-lwc
  - name: sf-testing
    source: jaganpro
    path: skills/sf-testing
  - name: sf-flex-estimator
    source: jaganpro
    path: skills/sf-flex-estimator

  # forcedotcom/sf-skills — full skill directories, cloned
  - name: generating-custom-field
    source: afv
    path: skills/generating-custom-field
  - name: generating-custom-object
    source: afv
    path: skills/generating-custom-object
  - name: generating-permission-set
    source: afv
    path: skills/generating-permission-set
  - name: developing-agentforce
    source: afv
    path: skills/developing-agentforce
  - name: testing-agentforce
    source: afv
    path: skills/testing-agentforce
  - name: observing-agentforce
    source: afv
    path: skills/observing-agentforce
