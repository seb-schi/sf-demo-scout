# External skill manifest for SF Demo Scout (plugin edition).
# Maintainer-only metadata: consumed by scripts/vendor-skills.sh at
# vendoring time, NOT read at runtime. Vendored skills ship inside the
# plugin under ${CLAUDE_PLUGIN_ROOT}/skills/.
#
# Current policy (2026-09-17): 26 declared skills split evenly between 13
# replace entries and 13 protected entries (11 adapted, 2 frozen). The
# Scout-owned demo-* skills are NOT vendored and are not listed here.
#
# 2026-06-29: all 18 actively-vendored skills RENAMED to upstream's domain-first
# convention (sf-skills v1.21.0 -> v1.26.0, the 2026-06-26 batch): e.g.
# generating-apex -> platform-apex-generate, developing-agentforce -> agentforce-generate,
# running-code-analyzer -> dx-code-analyzer-run. See PLAN 2026-06-29/1034. The frozen
# sf-flow stays sf-flow (A4V-blocked; upstream successor automation-flow-generate). Now
# that our names match upstream again, vendor-skills.sh re-vendoring works without a name
# map. The history comments BELOW describe the 06-18 re-point under the OLD names and are
# kept verbatim — do not rewrite them to the new names.
#
# To re-vendor the replace-policy entries at the reviewed revision: run
#   bash scripts/vendor-skills.sh
# from the plugin root, review the resulting git diff under skills/,
# and commit. Adapted and frozen entries are visibly skipped with their
# reasons. Advancing `revision:` requires a separate upstream review and
# manifest edit; `branch:` is descriptive and never controls checkout.
# The pinned SHA is the reviewed v1.52 refresh input; it does not claim that
# every current local skill was copied byte-for-byte from that revision.
# The dated comments below are historical provenance and do not override
# each entry's enforced current policy.

sources:
  # FROZEN 2026-06-18 — the `jaganpro` source is intentionally disabled.
  # Upstream branch `Jaganpro/sf-skills` was DELETED after merging to main,
  # where its sf-* skills were renamed (verb-based: sf-flow→generating-flow,
  # sf-data→handling-sf-data, etc.) AND several (generating-flow,
  # generating-lightning-app, generating-custom-lightning-type) were
  # re-architected to call a server-side `execute_metadata_action` MCP tool
  # that exists ONLY in Agentforce Vibes (A4V) — NOT in the public
  # @salesforce/mcp package Scout runs. Verified 2026-06-18 by a live
  # tools/call against the connected org: `-32602: Tool execute_metadata_action
  # not found` (a control run_soql_query on the same org succeeded). The 8
  # vendored sf-* skills stay frozen at their last-good vendoring (a37edd0,
  # 2026-05-25) — the self-contained copies are the only versions that run in
  # Scout's host. Re-evaluate when/if that tool ships in a GA public
  # @salesforce/mcp release — see pipeline-changes/2026-06-18 PLAN.
  #
  # jaganpro:
  #   repo: https://github.com/forcedotcom/sf-skills
  #   type: clone
  #   branch: Jaganpro/sf-skills   # DELETED upstream — do not re-enable
  #
  # 2026-06-18: the renamed/re-architected successors now live on `main` under
  # verb-based names (sf-lwc→generating-lwc-components, etc.). We re-point the 6
  # clean renames + adopt the apex methodology swap + 4 net-new declarative skills,
  # ALL from `afv`/main below. sf-flow stays frozen (A4V-blocked — generating-flow
  # calls execute_metadata_action, absent from @salesforce/mcp; re-verified live).
  afv:
    repo: https://github.com/forcedotcom/sf-skills
    type: clone
    branch: main
    revision: 8febf3f2bfb537a7586f36ee42dcf5e5d69c02a5

skills:
  - name: sf-flow
    policy: frozen
    reason: >-
      The upstream automation-flow-generate successor requires hosted-only
      execute_metadata_action; permanent hand-managed fork. Local maintenance on
      2026-09-22 adds canonical API-66 FlowTest templates, bounded testing guidance,
      and bundled handoffs. Frozen prevents upstream replacement, not these edits.

  # ── FROZEN (NOT vendored — vendored dir stays on disk, hand-managed) ────
  #   sf-flow — A4V-blocked. Upstream generating-flow calls execute_metadata_action
  #     (absent from @salesforce/mcp — re-verified live 2026-06-18). Ships 0 assets;
  #     Scout's sf-flow ships 14 templates + refs phase2 hardcodes. Re-point is a
  #     content rewrite gated on that tool shipping GA. DO NOT add a source entry.
  #
  # ── RE-POINTED 2026-06-18 (6 clean renames, now fetched from afv/main) ──
  #   sf-lwc→generating-lwc-components, sf-soql→querying-soql, sf-data→handling-sf-data,
  #   sf-debug→debugging-apex-logs, sf-deploy→deploying-metadata, sf-testing→running-apex-tests.
  #   Old sf-* dirs are deleted (see Files to Delete in the PLAN); new dirs vendored below.
  #
  # ── SWAPPED 2026-06-18 ─────────────────────────────────────────────────
  #   sf-apex→generating-apex (AFV fflib methodology + mandatory run_code_analyzer).
  #
  # ── CUT 2026-06-18 (removed from the bundle entirely) ──────────────────
  #   sf-flex-estimator — drifting hardcoded Flex Credit numbers, orphaned upstream.
  #   sf-permissions — zero pipeline refs; creation runs on generating-permission-set.

  # forcedotcom/sf-skills — full skill directories, cloned
  #
  # 2026-08-03 (PLAN 1106): agentforce-generate / agentforce-test / agentforce-observe
  # RE-VENDORED byte-verbatim to sf-skills v1.33.0 (fe3e2ed). Correctness fix — v1.33
  # test/observe require --simulate-actions|--use-live-actions on `sf agent preview
  # start --authoring-bundle` (sf CLI 2.131.0+); Scout's v1.0 copies omitted it. All
  # three tracked to upstream's current folder layout (stale pre-5a4d9c3 fossils
  # dropped; no Scout hand-edits existed). Pinned per-skill copy, NOT vendor-skills.sh.
  - name: platform-custom-field-generate
    source: afv
    path: skills/platform-custom-field-generate
    policy: replace
  - name: platform-custom-object-generate
    source: afv
    path: skills/platform-custom-object-generate
    policy: adapted
    reason: >-
      Preserves Scout's stripped human confirmation gate and current
      orchestrator-compatible behavior.
  - name: platform-permission-set-generate
    source: afv
    path: skills/platform-permission-set-generate
    policy: replace
  # 2026-08-17 (PLAN 2026-08-17/1000): agentforce-generate PARTIAL adopt of the
  # v1.38.0 (697c208) Audit/Repair capability. Content-only: 13 new references/
  # audit + control-flow files vendored byte-verbatim; the Audit/Repair task
  # domain grafted into SKILL.md COMPILER-NEUTRALIZED (Scout uses org-side
  # authoring-bundle validation, not the upstream bundled Node compiler).
  # scripts/ (index-agent.mjs + setup/loader) deliberately NOT vendored — external
  # @sf-agentscript SDK runtime dep, held out like the LWC SLDS-linter scripts.
  # SKILL.md is NOT byte-verbatim v1.38 (it retains the 281e296 SFAP-404 + 0242aaa
  # action-interface-relocation hand-edits); do NOT wholesale re-vendor it.
  - name: agentforce-generate
    source: afv
    path: skills/agentforce-generate
    policy: adapted
    reason: >-
      Preserves compiler-neutralized Audit/Repair content, prior SFAP action
      interface edits, and intentional omission of the external SDK scripts.
  - name: agentforce-test
    source: afv
    path: skills/agentforce-test
    policy: replace
  - name: agentforce-observe
    source: afv
    path: skills/agentforce-observe
    policy: replace

  # ── RE-POINTED renames (afv/main) ──────────────────────────────────────
  - name: experience-lwc-generate
    source: afv
    path: skills/experience-lwc-generate
    policy: adapted
    reason: >-
      Preserves hooks/scripts validator wiring instead of upstream's top-level
      migration, plus references to the frozen sf-flow skill.
  - name: platform-soql-query
    source: afv
    path: skills/platform-soql-query
    policy: replace
  - name: platform-data-manage
    source: afv
    path: skills/platform-data-manage
    policy: adapted
    reason: >-
      Preserves the held cross-reference to the frozen sf-flow skill.
  - name: platform-apex-logs-debug
    source: afv
    path: skills/platform-apex-logs-debug
    policy: replace
  - name: platform-metadata-deploy
    source: afv
    path: skills/platform-metadata-deploy
    policy: adapted
    reason: >-
      Preserves the held cross-reference to the frozen sf-flow skill.
  - name: platform-apex-test-run
    source: afv
    path: skills/platform-apex-test-run
    policy: adapted
    reason: >-
      Preserves the hooks/scripts/parse-test-results.py layout required by the
      current hook wiring.

  # ── SWAP: Apex methodology (afv/main) ──────────────────────────────────
  - name: platform-apex-generate
    source: afv
    path: skills/platform-apex-generate
    policy: adapted
    reason: >-
      Preserves intentionally held frontmatter/version while retaining the
      reviewed API 67 body-only graft.
  - name: platform-apex-test-generate
    source: afv
    path: skills/platform-apex-test-generate
    policy: adapted
    reason: >-
      Preserves intentionally held frontmatter/version while retaining the
      reviewed API 67 body-only graft.
  - name: dx-code-analyzer-run
    source: afv
    path: skills/dx-code-analyzer-run
    policy: adapted
    reason: >-
      Preserves delegation to held configuring-code-analyzer because its
      upstream successor is not vendored.

  # ── NEW declarative skills (afv/main) ──────────────────────────────────
  - name: platform-validation-rule-generate
    source: afv
    path: skills/platform-validation-rule-generate
    policy: replace
  - name: platform-list-view-generate
    source: afv
    path: skills/platform-list-view-generate
    policy: replace
  - name: platform-flexipage-generate
    source: afv
    path: skills/platform-flexipage-generate
    policy: frozen
    reason: >-
      Preserve the clean v1.29 copy because newer upstream requires hosted-only
      execute_metadata_action, a permanent Scout compatibility boundary.

  # ── NEW 2026-06-29: record-level sharing (afv/main, sf-skills v1.26.0) ──
  # RE-VENDORED 2026-07-27 to v1.1 (sf-skills v1.32.0) WITH the Phase 4 human-in-the-loop
  # confirmation gate stripped — 2nd gate-strip after platform-custom-object-generate (PLAN
  # 2026-06-29/1100). Upstream's examples/test-cases.md is deliberately NOT vendored (381 lines,
  # 12 of 17 cases test Edit/Delete/confirm paths Scout cannot reach); its one useful artifact
  # (composed Account owner rule) was grafted into references/rule-types.md. Permanent
  # intentional drift — do NOT "fix" it by re-vendoring verbatim. See PLAN 2026-07-27/0944.
  - name: platform-sharing-rules-generate
    source: afv
    path: skills/platform-sharing-rules-generate
    policy: adapted
    reason: >-
      Preserves the stripped confirmation gate and intentionally omitted
      upstream test cases while retaining Scout's composed-rule example.

  # ── NEW 2026-07-08: reusable value sets (afv/main, sf-skills v1.29.0) ──
  - name: platform-value-set-generate
    source: afv
    path: skills/platform-value-set-generate
    policy: replace

  # ── NEW 2026-07-20: custom report types (afv/main, sf-skills v1.31.0) ──
  - name: platform-custom-report-type-generate
    source: afv
    path: skills/platform-custom-report-type-generate
    policy: replace

  # ── NEW 2026-08-04: Lightning Reports (afv/main, sf-skills v1.33.0) ──
  - name: platform-report-generate
    source: afv
    path: skills/platform-report-generate
    policy: replace

  # ── NEW 2026-09-01: Custom Settings + Custom Metadata Types (afv/main, sf-skills v1.44.0, 74ea89b) ──
  # Byte-verbatim vendor (pure cp at pinned SHA, NOT vendor-skills.sh, NOT a graft — no prior Scout copy).
  # Both A4V-clean (no execute_metadata_action). CMDT ships references/cmdt-records.md + scripts/
  # sanitize-developer-name.sh — the script is a SELF-CONTAINED POSIX sed helper (no external runtime dep),
  # so unlike the held-out LWC SLDS-linter / agentforce SDK scripts it IS vendored. Custom Setting is a
  # single SKILL.md (no refs, no scripts). See PLAN 2026-09-01/1014.
  - name: platform-custom-setting-generate
    source: afv
    path: skills/platform-custom-setting-generate
    policy: replace
  - name: platform-custom-metadata-type-generate
    source: afv
    path: skills/platform-custom-metadata-type-generate
    policy: replace

  # ── NEW 2026-09-02: Email-to-Case (afv/main, sf-skills v1.44.0, 74ea89b) ──
  # Byte-verbatim vendor (pure cp at pinned SHA, NOT vendor-skills.sh, NOT a graft — no prior Scout copy).
  # A4V-clean (no execute_metadata_action). Scripts (apply-casesettings.py, validate-casesettings.py,
  # check-agent-email-capability.sh) are stdlib-only Python/POSIX bash — reuse the sf-CLI-authenticated
  # session (`sf org display` / `sf org auth show-access-token`), no external SDK or credential handling,
  # same trust profile as the CMDT sanitize-developer-name.sh precedent (see PLAN 2026-09-01/1014).
  # scripts/tests/ intentionally NOT vendored — maintainer-facing unit tests for the skill's own script
  # logic; Scout invokes the scripts, never edits them, so there is nothing here to test against.
  # Gated tier, not Autonomous — enabling Email-to-Case is permanent and org-wide. See PLAN 2026-09-02/1009.
  # ADAPTED 2026-09-17 (Batch 4): SKILL.md is base-E2C-only. Scout's orchestrator/Phase 3
  # owns the agent entitlement check and channel handoff; do not restore upstream's
  # implicit agent/channel delegation by wholesale replacement. Scripts remain unchanged.
  - name: service-email-to-case-configure
    source: afv
    path: skills/service-email-to-case-configure
    policy: adapted
    reason: >-
      Preserves Scout's base Email-to-Case scope while the orchestrator owns
      entitlement/channel handoff; scripts remain unchanged and upstream
      scripts/tests remains intentionally omitted.
