# External skill manifest for SF Demo Scout (plugin edition).
# Maintainer-only metadata: consumed by scripts/vendor-skills.sh at
# vendoring time, NOT read at runtime. Vendored skills ship inside the
# plugin under ${CLAUDE_PLUGIN_ROOT}/skills/.
#
# As of 2026-06-18: 6 upstream skills are actively vendored from the
# `afv` source (main); 8 sf-* skills are FROZEN (jaganpro source disabled
# below — see the note there); 2 skills (sf-flex-estimator, sf-permissions)
# were CUT. The 3 Scout-owned demo-* skills are NOT vendored and not listed
# here.
#
# 2026-06-29: all 18 actively-vendored skills RENAMED to upstream's domain-first
# convention (sf-skills v1.21.0 -> v1.26.0, the 2026-06-26 batch): e.g.
# generating-apex -> platform-apex-generate, developing-agentforce -> agentforce-generate,
# running-code-analyzer -> dx-code-analyzer-run. See PLAN 2026-06-29/1034. The frozen
# sf-flow stays sf-flow (A4V-blocked; upstream successor automation-flow-generate). Now
# that our names match upstream again, vendor-skills.sh re-vendoring works without a name
# map. The history comments BELOW describe the 06-18 re-point under the OLD names and are
# kept verbatim — do not rewrite them to the new names.
#
# To re-vendor (e.g. pull latest upstream): run
#   bash scripts/vendor-skills.sh
# from the plugin root, review the resulting git diff under skills/,
# and commit. With jaganpro disabled, the script touches ONLY the 6 afv
# skills — the frozen sf-* dirs are left untouched on disk. Edit `branch:`
# below to pin a different upstream branch (or change `repo:` to repoint).

sources:
  # FROZEN 2026-06-18 — the `jaganpro` source is intentionally disabled.
  # Upstream branch `Jaganpro/sf-skills` was DELETED after merging to main,
  # where its sf-* skills were renamed (verb-based: sf-flow→generating-flow,
  # sf-data→handling-sf-data, etc.) AND several (generating-flow,
  # generating-lightning-app, generating-custom-lightning-type) were
  # re-architected to call a server-side `execute_metadata_action` MCP tool
  # that exists ONLY in Agentforce Vibes (A4V) — NOT in the public
  # @salesforce/mcp package Scout runs. Verified 2026-06-18 by a live
  # tools/call against the connected org: `-32602: Tool execute_metadata_action
  # not found` (a control run_soql_query on the same org succeeded). The 8
  # vendored sf-* skills stay frozen at their last-good vendoring (a37edd0,
  # 2026-05-25) — the self-contained copies are the only versions that run in
  # Scout's host. Re-evaluate when/if that tool ships in a GA public
  # @salesforce/mcp release — see pipeline-changes/2026-06-18 PLAN.
  #
  # jaganpro:
  #   repo: https://github.com/forcedotcom/sf-skills
  #   type: clone
  #   branch: Jaganpro/sf-skills   # DELETED upstream — do not re-enable
  #
  # 2026-06-18: the renamed/re-architected successors now live on `main` under
  # verb-based names (sf-lwc→generating-lwc-components, etc.). We re-point the 6
  # clean renames + adopt the apex methodology swap + 4 net-new declarative skills,
  # ALL from `afv`/main below. sf-flow stays frozen (A4V-blocked — generating-flow
  # calls execute_metadata_action, absent from @salesforce/mcp; re-verified live).
  afv:
    repo: https://github.com/forcedotcom/sf-skills
    type: clone
    branch: main

skills:
  # ── FROZEN (NOT vendored — vendored dir stays on disk, hand-managed) ────
  #   sf-flow — A4V-blocked. Upstream generating-flow calls execute_metadata_action
  #     (absent from @salesforce/mcp — re-verified live 2026-06-18). Ships 0 assets;
  #     Scout's sf-flow ships 14 templates + refs phase2 hardcodes. Re-point is a
  #     content rewrite gated on that tool shipping GA. DO NOT add a source entry.
  #
  # ── RE-POINTED 2026-06-18 (6 clean renames, now fetched from afv/main) ──
  #   sf-lwc→generating-lwc-components, sf-soql→querying-soql, sf-data→handling-sf-data,
  #   sf-debug→debugging-apex-logs, sf-deploy→deploying-metadata, sf-testing→running-apex-tests.
  #   Old sf-* dirs are deleted (see Files to Delete in the PLAN); new dirs vendored below.
  #
  # ── SWAPPED 2026-06-18 ─────────────────────────────────────────────────
  #   sf-apex→generating-apex (AFV fflib methodology + mandatory run_code_analyzer).
  #
  # ── CUT 2026-06-18 (removed from the bundle entirely) ──────────────────
  #   sf-flex-estimator — drifting hardcoded Flex Credit numbers, orphaned upstream.
  #   sf-permissions — zero pipeline refs; creation runs on generating-permission-set.

  # forcedotcom/sf-skills — full skill directories, cloned
  - name: platform-custom-field-generate
    source: afv
    path: skills/platform-custom-field-generate
  - name: platform-custom-object-generate
    source: afv
    path: skills/platform-custom-object-generate
  - name: platform-permission-set-generate
    source: afv
    path: skills/platform-permission-set-generate
  - name: agentforce-generate
    source: afv
    path: skills/agentforce-generate
  - name: agentforce-test
    source: afv
    path: skills/agentforce-test
  - name: agentforce-observe
    source: afv
    path: skills/agentforce-observe

  # ── RE-POINTED renames (afv/main) ──────────────────────────────────────
  - name: experience-lwc-generate
    source: afv
    path: skills/experience-lwc-generate
  - name: platform-soql-query
    source: afv
    path: skills/platform-soql-query
  - name: platform-data-manage
    source: afv
    path: skills/platform-data-manage
  - name: platform-apex-logs-debug
    source: afv
    path: skills/platform-apex-logs-debug
  - name: platform-metadata-deploy
    source: afv
    path: skills/platform-metadata-deploy
  - name: platform-apex-test-run
    source: afv
    path: skills/platform-apex-test-run

  # ── SWAP: Apex methodology (afv/main) ──────────────────────────────────
  - name: platform-apex-generate
    source: afv
    path: skills/platform-apex-generate
  - name: platform-apex-test-generate
    source: afv
    path: skills/platform-apex-test-generate
  - name: dx-code-analyzer-run
    source: afv
    path: skills/dx-code-analyzer-run

  # ── NEW declarative skills (afv/main) ──────────────────────────────────
  - name: platform-validation-rule-generate
    source: afv
    path: skills/platform-validation-rule-generate
  - name: platform-list-view-generate
    source: afv
    path: skills/platform-list-view-generate
  - name: platform-flexipage-generate
    source: afv
    path: skills/platform-flexipage-generate

  # ── NEW 2026-06-29: record-level sharing (afv/main, sf-skills v1.26.0) ──
  - name: platform-sharing-rules-generate
    source: afv
    path: skills/platform-sharing-rules-generate

  # ── NEW 2026-07-08: reusable value sets (afv/main, sf-skills v1.29.0) ──
  - name: platform-value-set-generate
    source: afv
    path: skills/platform-value-set-generate

  # ── NEW 2026-07-20: custom report types (afv/main, sf-skills v1.31.0) ──
  - name: platform-custom-report-type-generate
    source: afv
    path: skills/platform-custom-report-type-generate
